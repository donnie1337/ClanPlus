# ╔══════════════════════════════════════════════════════════════╗
# ║                         CLANPLUS                             ║
# ║              Configuração do sistema de clans              ║
# ╚══════════════════════════════════════════════════════════════╝

clan:
  name-min-length: 3
  name-max-length: 16
  tag-min-length: 3
  tag-max-length: 3
  max-members: 30
  invite-expiration-minutes: 10
  allow-member-chest: true
  allow-member-home: true
  require-online-target-for-invite: true

progression:
  # XP base necessário por nível. O Clan ganha XP com abates e mortes.
  xp-per-level: 1000
  # XP por abate de membro.
  kill-xp: 10
  # XP por morte de membro.
  death-xp: 2
  # Limite máximo de nível.
  max-level: 100
  upgrades:
    # Cada nível adiciona +5 vagas ao limite base.
    member-limit-max: 10
    # Cada nível adiciona +10% de XP recebido por abates.
    xp-boost-max: 10
    base-cost: 500

coins:
  placeholder: '%vault_eco_balance_fixed%'

storage:
  file: clans.yml
  # O ClanPlus mantém clans.yml.bak e grava primeiro em um arquivo temporário.
  safe-save: true

teleport:
  warmup-seconds: 3
